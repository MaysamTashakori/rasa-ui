name: Rasa UI build
on:
  push:
    paths: ["rasa/**", ".github/workflows/rasa-ui.yml"]
  pull_request:
    paths: ["rasa/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rasa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
